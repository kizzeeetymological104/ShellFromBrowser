services:
  shellfb:
    build: .
    image: shellfb:latest
    container_name: shellfb
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/etc/shellfb/config.yaml:ro
      - shellfb-recordings:/home/shellfb/recordings
    environment:
      - SHELLFB_ADDR=:8080
    restart: unless-stopped

volumes:
  shellfb-recordings:

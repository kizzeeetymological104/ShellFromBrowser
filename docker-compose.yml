version: '3.9'

# ============================================
# ShellFromBrowser — Docker Compose Stack
# ============================================
# Lancer la stack complète : docker-compose up -d
# Arrêter : docker-compose down
# Logs : docker-compose logs -f <service>

services:
  # ==========================================
  # Redis Sentinel (HA Master + 2 Replicas)
  # ==========================================
  redis-master:
    image: redis:7-alpine
    container_name: sfb-redis-master
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data
    networks:
      - sfb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  redis-replica-1:
    image: redis:7-alpine
    container_name: sfb-redis-replica-1
    command: redis-server --replicaof redis-master 6379 --requirepass ${REDIS_PASSWORD} --masterauth ${REDIS_PASSWORD}
    depends_on:
      - redis-master
    networks:
      - sfb-network
    restart: unless-stopped

  redis-replica-2:
    image: redis:7-alpine
    container_name: sfb-redis-replica-2
    command: redis-server --replicaof redis-master 6379 --requirepass ${REDIS_PASSWORD} --masterauth ${REDIS_PASSWORD}
    depends_on:
      - redis-master
    networks:
      - sfb-network
    restart: unless-stopped

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: sfb-redis-sentinel-1
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 2
      sentinel auth-pass mymaster ${REDIS_PASSWORD}
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 30000' > /etc/redis/sentinel.conf &&
      redis-sentinel /etc/redis/sentinel.conf"
    depends_on:
      - redis-master
    ports:
      - "26379:26379"
    networks:
      - sfb-network
    restart: unless-stopped

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: sfb-redis-sentinel-2
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 2
      sentinel auth-pass mymaster ${REDIS_PASSWORD}
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 30000' > /etc/redis/sentinel.conf &&
      redis-sentinel /etc/redis/sentinel.conf"
    depends_on:
      - redis-master
    ports:
      - "26380:26379"
    networks:
      - sfb-network
    restart: unless-stopped

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: sfb-redis-sentinel-3
    command: >
      sh -c "echo 'sentinel monitor mymaster redis-master 6379 2
      sentinel auth-pass mymaster ${REDIS_PASSWORD}
      sentinel down-after-milliseconds mymaster 5000
      sentinel parallel-syncs mymaster 1
      sentinel failover-timeout mymaster 30000' > /etc/redis/sentinel.conf &&
      redis-sentinel /etc/redis/sentinel.conf"
    depends_on:
      - redis-master
    ports:
      - "26381:26379"
    networks:
      - sfb-network
    restart: unless-stopped

  # ==========================================
  # PostgreSQL (Audit Logs)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: sfb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sfb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Backend (WebSocket Gateway + Session Manager)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: sfb-backend
    env_file:
      - .env
    environment:
      - REDIS_SENTINELS=redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      - POSTGRES_HOST=postgres
    ports:
      - "8080:8080"
      - "9090:9090"  # Prometheus metrics
    depends_on:
      - redis-master
      - postgres
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker API access
      - ./backend/logs:/app/logs
    networks:
      - sfb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # Frontend (React SPA)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: sfb-frontend
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8080
      - REACT_APP_WS_URL=ws://localhost:8080/ws
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sfb-network
    restart: unless-stopped

  # ==========================================
  # HAProxy (Load Balancer)
  # ==========================================
  haproxy:
    image: haproxy:2.8-alpine
    container_name: sfb-haproxy
    ports:
      - "80:80"
      - "443:443"
      - "8404:8404"  # Stats page
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./infra/haproxy/certs:/etc/haproxy/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sfb-network
    restart: unless-stopped

  # ==========================================
  # Prometheus (Monitoring)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: sfb-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9091:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    networks:
      - sfb-network
    restart: unless-stopped

  # ==========================================
  # Grafana (Dashboards)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: sfb-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sfb-network
    restart: unless-stopped

# ============================================
# Networks
# ============================================
networks:
  sfb-network:
    driver: bridge

# ============================================
# Volumes (Persistent Data)
# ============================================
volumes:
  redis-master-data:
  postgres-data:
  prometheus-data:
  grafana-data:
